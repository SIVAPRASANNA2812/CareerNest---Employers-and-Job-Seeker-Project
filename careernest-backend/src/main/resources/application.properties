spring.application.name=careernest-backend

# Dynamic port: Uses Render's $PORT when deployed, falls back to 8081 locally
server.port=${PORT:8081}
spring.data.mongodb.auto-index-creation=true

# MongoDB: Reads MONGODB_URI on Render, falls back to local Mongo on laptop
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/careernestDb}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/careernestDb}
spring.mongodb.database=${MONGODB_DATABASE:careernestDb}

# JWT Configuration (Access Token: 15 mins | Refresh Token: 7 days)
jwt.secret=${JWT_SECRET:mySecretKeyForTestingCareerNestApplication2026SecureKey123}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Twilio SMS: Reads Twilio keys on Render, falls back to simulator locally
twilio.account.sid=${TWILIO_ACCOUNT_SID:dummy_sid}
twilio.auth.token=${TWILIO_AUTH_TOKEN:dummy_token}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+1234567890}

# Swagger / OpenAPI 3 Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method